# IceGrid 3.8.2 管理客户端配置。

# Registry Locator；实例名、主机和端口必须与 registry.cfg 的 Client.Endpoints 一致。
Ice.Default.Locator=MtIceGrid/Locator:default -h 127.0.0.1 -p 18000

# icegridadmin 登录用户名；只有 Registry 配置正式 AdminPermissionsVerifier 后才会严格校验。
IceGridAdmin.Username=admin

# icegridadmin 登录密码；生产环境不要沿用示例密码，也不要把真实密码提交到公共仓库。
IceGridAdmin.Password=mtadmin

# 管理客户端在 Ice 日志和诊断信息中的程序名。
Ice.ProgramName=MtIceGridAdmin
