# IceGrid 3.8.2 默认本地 Node 配置。
# 当前默认 Node 名为 CloudNetNode1，Registry 与 Node 运行在同一台机器。

# Registry Locator；实例名、主机和端口必须与 registry.cfg 完全一致。
# 远程 Node 必须填写 Registry 的业务网 IP，不能填写远程 Node 自己的 127.0.0.1。
Ice.Default.Locator=MtIceGrid/Locator:default -h 127.0.0.1 -p 18000

# Node 在同一 IceGrid 实例内的唯一名称；修改后要同步服务名、启动脚本和 MtApplication.xml。
IceGrid.Node.Name=CloudNetNode1

# Node 本地数据库目录；保存托管 Server 配置和运行状态，不得与其他 Node 共用。
# tool\install_icegrid_wtgrid.bat 生成服务配置时会用部署根目录下的绝对路径覆盖此值。
IceGrid.Node.Data=db/node1

# IceGrid 托管业务进程的标准输出目录；服务配置会覆盖为绝对路径。
IceGrid.Node.Output=log

# Node 启停托管进程的 Activator 跟踪级别。
IceGrid.Node.Trace.Activator=1

# Node 管理托管 Server 状态、配置和启动失败的跟踪级别。
IceGrid.Node.Trace.Server=2

# Node 自身标准输出日志；服务配置会覆盖为部署根目录下的绝对路径。
Ice.StdOut=log/node_stdout.txt

# Node 自身标准错误日志；注册失败、权限错误和数据损坏优先查看此文件。
Ice.StdErr=log/node_stderr.txt

# Node 进程在 Ice 日志和诊断信息中的程序名。
Ice.ProgramName=CloudNetNode1
