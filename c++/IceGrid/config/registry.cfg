# IceGrid 3.8.2 Registry 配置。
# 本文件与 node.cfg、admin.cfg 和业务 IceRPCPush.xml 中的 Ice.Default.Locator 保持一致。

# IceGrid 实例名；决定 Locator 标识和 Windows 服务名中的实例段。
IceGrid.InstanceName=MtIceGrid

# Registry 自己访问 Locator 使用的代理；本机单节点为 127.0.0.1，多机部署改成 Registry 业务网 IP。
Ice.Default.Locator=MtIceGrid/Locator:default -h 127.0.0.1 -p 18000

# Client Adapter：业务客户端、业务服务、Node 和 icegridadmin 获取 Locator 的入口。
# 多机部署时把 127.0.0.1 改成 Registry 业务网 IP，并在防火墙开放该端口。
IceGrid.Registry.Client.Endpoints=default -h 127.0.0.1 -p 18000 -t 10000

# Server Adapter：接收业务 Server 注册、注销和端点更新；不写 -p 时由系统分配端口。
# 多机生产环境建议设置 Registry 业务网 IP 和固定端口，便于配置防火墙。
IceGrid.Registry.Server.Endpoints=default -h 127.0.0.1 -t 10000

# Internal Adapter：Registry 与 IceGrid Node 的内部管理通道。
# 有远程 Node 时必须发布远程 Node 可达的 Registry 业务网 IP，不能使用 127.0.0.1。
IceGrid.Registry.Internal.Endpoints=default -h 127.0.0.1 -t 10000

# Registry LMDB 数据目录；保存应用描述、对象、副本组和部署信息。
# tool\install_icegrid_wtgrid.bat 生成服务配置时会用部署根目录下的绝对路径覆盖此值。
IceGrid.Registry.LMDB.Path=db/registry

# 业务客户端权限验证器；NullPermissionsVerifier 表示不校验用户名和密码，仅适合受控内网或联调。
IceGrid.Registry.PermissionsVerifier=MtIceGrid/NullPermissionsVerifier

# 管理客户端权限验证器；当前允许任意用户名和密码，生产环境应替换为正式验证器。
IceGrid.Registry.AdminPermissionsVerifier=MtIceGrid/NullPermissionsVerifier

# SSL 业务客户端权限验证器；当前为空验证器。
IceGrid.Registry.SSLPermissionsVerifier=MtIceGrid/NullSSLPermissionsVerifier

# SSL 管理客户端权限验证器；当前为空验证器。
IceGrid.Registry.AdminSSLPermissionsVerifier=MtIceGrid/NullSSLPermissionsVerifier

# 允许非 IceGrid 托管的业务进程用 AdapterId/ReplicaGroupId 动态注册。
IceGrid.Registry.DynamicRegistration=1

# Registry 标准输出日志；服务配置会覆盖为部署根目录下的绝对路径。
Ice.StdOut=log/registry_stdout.txt

# Registry 标准错误日志；启动、端口、权限和 LMDB 错误优先查看此文件。
Ice.StdErr=log/registry_stderr.txt

# Registry 进程在 Ice 日志和诊断信息中的程序名。
Ice.ProgramName=MtIceGridRegistry

# Node 注册与状态变化跟踪级别；0 关闭，数值越大日志越详细。
IceGrid.Registry.Trace.Node=2

# Registry 副本和副本组行为跟踪级别。
IceGrid.Registry.Trace.Replica=2

# TCP/UDP 连接建立、断开和失败跟踪级别。
Ice.Trace.Network=1

# Ice 协议消息跟踪级别；数据量较大，默认关闭。
Ice.Trace.Protocol=0

# Locator 查询、缓存和解析跟踪级别。
Ice.Trace.Locator=2
