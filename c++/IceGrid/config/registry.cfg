# IceGrid 3.8.2 本地注册中心配置。
# 本文件与 CloudNetDataApi\IceRPCPush.xml 中的 Ice.Default.Locator 保持一致。

# IceGrid 实例名，必须与 Ice.Default.Locator 的 MtIceGrid 前缀一致。
IceGrid.InstanceName=MtIceGrid

# 当前注册中心也通过 Locator 访问自己，便于 icegridadmin 和 node 使用同一配置。
Ice.Default.Locator=MtIceGrid/Locator:default -h 127.0.0.1 -p 18000

# Client.Endpoints 是业务进程、icegridadmin 和 node 访问 Locator 的入口。
IceGrid.Registry.Client.Endpoints=default -h 127.0.0.1 -p 18000 -t 10000
# Server.Endpoints 是注册中心对已注册服务的管理通信入口。
IceGrid.Registry.Server.Endpoints=default -h 127.0.0.1 -t 10000
# Internal.Endpoints 是注册中心内部通信入口。
IceGrid.Registry.Internal.Endpoints=default -h 127.0.0.1 -t 10000

# 新版 IceGrid 数据目录；不要复用旧 Ice 3.5.1 的 db/master。
IceGrid.Registry.Data=../db/registry

# 本地联调用空权限校验，避免开发阶段账号配置阻塞。
IceGrid.Registry.PermissionsVerifier=MtIceGrid/NullPermissionsVerifier
IceGrid.Registry.AdminPermissionsVerifier=MtIceGrid/NullPermissionsVerifier
IceGrid.Registry.SSLPermissionsVerifier=MtIceGrid/NullSSLPermissionsVerifier
IceGrid.Registry.AdminSSLPermissionsVerifier=MtIceGrid/NullSSLPermissionsVerifier

# 允许插件手工启动后通过 Locator 动态注册对象适配器。
IceGrid.Registry.DynamicRegistration=1

# 日志输出目录。
Ice.StdOut=../log/registry_stdout.txt
Ice.StdErr=../log/registry_stderr.txt
Ice.ProgramName=MtIceGridRegistry

# 跟踪开关，开发期便于观察 node、replica 和 locator 行为。
IceGrid.Registry.Trace.Node=2
IceGrid.Registry.Trace.Replica=2
Ice.Trace.Network=1
Ice.Trace.Protocol=0
Ice.Trace.Locator=2

# icegridadmin 默认账号；本地联调使用。
IceGridAdmin.Username=admin
IceGridAdmin.Password=mtadmin
